name: stylik
description: "L'Atelier — application de gestion de salon de coiffure (mobile & tablette)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Libellés natifs (sélecteurs de date et d'heure) en français
  flutter_localizations:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.16.0
  flutter_dotenv: ^6.0.1

  # State management / injection de dépendances
  flutter_riverpod: ^2.6.1

  # UI
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.9

  # Formatage (dates, montants FCFA)
  # Épinglé sur la version qu'impose `flutter_localizations` du SDK.
  intl: ^0.20.2
  
  # Photos avant / après  
  image_picker: ^1.1.2
  
  # Cache local et mode hors-ligne
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.1.5
  uuid: ^4.6.0
  share_plus: ^11.1.0
  path_provider: ^2.1.6

  # Facture : génération du document et impression / partage
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Icônes générées depuis assets/icons/icon-square.svg (cf. doc/App gestion
# coiffeur/export-icones/). Regénérer avec : dart run flutter_launcher_icons
#
# Les masters vivent dans `tool/icons/` et non dans `assets/` : ils ne servent
# qu'au build, les embarquer alourdirait l'APK de ~106 Ko jamais chargés.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "tool/icons/logo.png"
  min_sdk_android: 21
  # Android 8+ : le lanceur applique son propre masque (rond, écureuil, goutte)
  # et recadre jusqu'à 33 %. Fond et glyphe sont donc fournis séparément.
  adaptive_icon_background: "tool/icons/icon_background.png"
  adaptive_icon_foreground: "tool/icons/icon_foreground.png"
  # L'App Store refuse toute transparence dans l'icône.
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/

  # Polices de la maquette, embarquées pour rester fidèles hors connexion.
  # Fichiers variables (axe wght 400→800, licence OFL dans assets/fonts/) :
  # la graisse exacte est appliquée via `FontVariation` dans app_typography.dart.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-VariableFont_wght.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf
